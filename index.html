<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>神学（哲学）者辞典</title>
  <meta name="description" content="古代から現代までの神学者を、名前・時代・伝統・神学的テーマから検索できる辞典">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="site-title"><a href="./">神学（哲学）者辞典</a></h1>
      <p class="site-sub">古代から現代まで ― 名前から、テーマから神学者を引く</p>
    </div>
  </header>

  <main class="wrap">
    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-view="search" aria-selected="true">名前で探す</button>
      <button class="tab" role="tab" data-view="themes" aria-selected="false">テーマで探す</button>
      <button class="tab" role="tab" data-view="timeline" aria-selected="false">年表で見る</button>
      <button class="tab" role="tab" data-view="quiz" aria-selected="false">クイズ</button>
    </nav>

    <!-- 名前・キーワード検索 -->
    <section id="view-search" class="view">
      <div class="search-box">
        <input id="q" type="search" placeholder="名前・キーワード・著作名（例：ルター、信仰義認、神の痛み）" autocomplete="off">
      </div>
      <div class="tradition-row">
        <select id="tradition-select" aria-label="教派で絞り込む"></select>
      </div>
      <div class="filter-row">
        <span class="filter-label">時代</span>
        <div class="chips chips-small" id="era-chips"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">出身国</span>
        <div class="chips chips-small" id="country-chips"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label">分野</span>
        <div class="chips chips-small" id="field-chips"></div>
      </div>
      <div class="active-theme" id="active-theme" hidden></div>
      <p class="count" id="count"></p>
      <div class="grid" id="results"></div>
    </section>

    <!-- テーマ一覧 -->
    <section id="view-themes" class="view" hidden>
      <p class="lead">テーマを選ぶと、そのテーマに関わる神学者が表示されます。</p>
      <div class="theme-cloud" id="theme-cloud"></div>
    </section>

    <!-- 年表 -->
    <section id="view-timeline" class="view" hidden>
      <div class="tl-controls">
        <span class="filter-label">出来事を表示</span>
        <div id="timeline-kinds"></div>
      </div>
      <div id="timeline"></div>
    </section>

    <!-- クイズ -->
    <section id="view-quiz" class="view" hidden>
      <div id="quiz"></div>
    </section>
  </main>

  <dialog id="detail" aria-labelledby="d-name">
    <article class="detail">
      <button class="close" id="d-close" aria-label="閉じる">×</button>
      <p class="d-meta" id="d-meta"></p>
      <h2 id="d-name"></h2>
      <p class="d-original" id="d-original"></p>
      <p class="d-summary" id="d-summary"></p>
      <div id="d-more" hidden>
        <h3>生涯</h3>
        <p class="d-text" id="d-life"></p>
        <h3>思想のポイント</h3>
        <ul class="d-points" id="d-points"></ul>
        <h3>影響と評価</h3>
        <p class="d-text" id="d-influence"></p>
      </div>
      <div id="d-affil-wrap" hidden>
        <h3>主な所属校</h3>
        <p class="d-affil" id="d-affil"></p>
      </div>
      <h3>主著</h3>
      <ul id="d-works"></ul>
      <h3>神学的テーマ</h3>
      <div class="tags" id="d-themes"></div>
      <h3>キーワード</h3>
      <div class="kw" id="d-keywords"></div>
      <h3>関連する神学者</h3>
      <div class="related" id="d-related"></div>
    </article>
  </dialog>

  <footer class="site-footer">
    <div class="wrap">
      <p>収録 <span id="total"></span> 名。各項目は概要です。研究・説教準備では専門の辞典・原典で確認してください。</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/events.js"></script>
  <script src="js/details.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
